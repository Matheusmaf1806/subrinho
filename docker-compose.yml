services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subrinho
      POSTGRES_PASSWORD: subrinho
      POSTGRES_DB: subrinho
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
